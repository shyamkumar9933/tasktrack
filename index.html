<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTrack | Smart Task Management</title>
<style>
:root {
  --bg: #f4f7fb;
  --card: #fff;
  --text: #172033;
  --muted: #64748b;
  --primary: #315bea;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  background: #172554;
  color: white;
  padding: 20px max(5%, calc((100% - 1050px)/2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.logo { font-size: 25px; font-weight: 800; }
.logo span { color: #93c5fd; }
.header-tag { color: #cbd5e1; font-size: 14px; }
main { max-width: 1050px; margin: 32px auto; padding: 0 20px; }
h1, h2, h3, p { margin-top: 0; }
.welcome { margin-bottom: 24px; }
.welcome h1 { margin-bottom: 8px; font-size: 30px; }
.welcome p { color: var(--muted); margin-bottom: 0; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.card, .panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
}
.card p { color: var(--muted); margin-bottom: 10px; font-size: 14px; }
.card h2 { margin: 0; font-size: 30px; }
.panel { margin-bottom: 20px; }
.panel h2 { font-size: 19px; margin-bottom: 18px; }
form {
  display: grid;
  grid-template-columns: minmax(160px, 2fr) minmax(130px, 1fr) minmax(140px, 1fr) auto;
  gap: 10px;
}
input, select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  background: white;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text);
}
button {
  padding: 11px 15px;
  border: none;
  border-radius: 8px;
  background: var(--primary);
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
button:hover { filter: brightness(.94); }
button:disabled { opacity: .6; cursor: not-allowed; }
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 22px 0 14px;
}
.filters button { background: #e8edf8; color: #334155; }
.filters button.active { background: var(--primary); color: white; }
.search { margin-bottom: 15px; }
.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.task:last-child { border-bottom: none; }
.task-check {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  cursor: pointer;
}
.task-info { flex: 1; min-width: 0; }
.task-name {
  display: block;
  font-weight: 600;
  overflow-wrap: anywhere;
  margin-bottom: 7px;
}
.task-meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;
  padding: 4px 9px;
}
.high { background: #fee2e2; color: #b91c1c; }
.medium { background: #fef3c7; color: #92400e; }
.low { background: #dcfce7; color: #166534; }
.due { background: #e0e7ff; color: #3730a3; }
.overdue { background: #b91c1c; color: white; }
.completed .task-name {
  text-decoration: line-through;
  color: #94a3b8;
}
.completed .pill { opacity: .7; }
.delete { background: #fee2e2; color: #b91c1c; padding: 8px 11px; flex-shrink: 0; }
.empty { text-align: center; color: var(--muted); padding: 35px 10px; }
.notice {
  padding: 12px 14px;
  border-radius: 8px;
  margin-bottom: 18px;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.notice.error { background: #fee2e2; color: #991b1b; }
.notice.success { background: #dcfce7; color: #166534; }
.notice.info { background: #e0e7ff; color: #3730a3; }
.hidden { display: none; }
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 25px; }
@media(max-width: 760px) {
  form { grid-template-columns: 1fr 1fr; }
  form input:first-child, form button { grid-column: 1 / -1; }
}
@media(max-width: 520px) {
  header { padding: 18px; }
  .header-tag { display: none; }
  main { margin-top: 24px; padding: 0 13px; }
  .welcome h1 { font-size: 25px; }
  .stats { gap: 8px; }
  .card { padding: 14px 10px; }
  .card h2 { font-size: 24px; }
  .card p { font-size: 12px; }
  .panel { padding: 16px; }
  form { grid-template-columns: 1fr; }
  form input:first-child, form button { grid-column: auto; }
  .task { gap: 8px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">Task<span>Track</span></div>
  <div class="header-tag">My Personal Workspace</div>
</header>

<main>
  <section class="welcome">
    <h1>My Tasks</h1>
    <p>Plan your work. Prioritize what matters. Get things done.</p>
  </section>

  <div id="notice" class="notice hidden" role="status"></div>

  <section class="stats">
    <div class="card"><p>Total Tasks</p><h2 id="total">0</h2></div>
    <div class="card"><p>Completed</p><h2 id="done">0</h2></div>
    <div class="card"><p>Pending</p><h2 id="pending">0</h2></div>
  </section>

  <section class="panel">
    <h2>Create a Task</h2>
    <form id="taskForm">
      <input id="taskInput" maxlength="200" placeholder="What do you need to do?" required>
      <select id="taskPriority" aria-label="Task priority">
        <option value="Medium">Medium Priority</option>
        <option value="High">High Priority</option>
        <option value="Low">Low Priority</option>
      </select>
      <input id="taskDue" type="date" aria-label="Due date">
      <button id="addButton" type="submit">+ Add Task</button>
    </form>

    <div class="filters">
      <button type="button" class="active" data-filter="All">All Tasks</button>
      <button type="button" data-filter="Pending">Pending</button>
      <button type="button" data-filter="Completed">Completed</button>
    </div>

    <input id="searchInput" class="search" placeholder="Search tasks..." aria-label="Search tasks">
    <div id="taskList"></div>
  </section>
  <div class="footer">TaskTrack · Personal Task Management</div>
</main>

<script>
const API_URL = "http://localhost:8080/api/tasks";

const form = document.getElementById("taskForm");
const input = document.getElementById("taskInput");
const priorityInput = document.getElementById("taskPriority");
const dueInput = document.getElementById("taskDue");
const searchInput = document.getElementById("searchInput");
const list = document.getElementById("taskList");
const notice = document.getElementById("notice");
const addButton = document.getElementById("addButton");

let tasks = [];
let currentFilter = "All";
let busy = false;

function showNotice(message, type = "info") {
  notice.textContent = message;
  notice.className = "notice " + type;
}

function hideNotice() {
  notice.textContent = "";
  notice.className = "notice hidden";
}

async function apiRequest(path = "", options = {}) {
  let response;

  try {
    response = await fetch(API_URL + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });
  } catch (error) {
    throw new Error(
      "Cannot connect to the backend. Start Spring Boot and try again."
    );
  }

  if (!response.ok) {
    throw new Error("Backend error: HTTP " + response.status);
  }

  if (response.status === 204) return null;

  const text = await response.text();
  return text ? JSON.parse(text) : null;
}

// Convert backend Task objects (title) into the frontend format (name).
function fromApi(task) {
  return {
    id: task.id,
    name: task.title ?? task.name ?? "",
    priority: ["High", "Medium", "Low"].includes(task.priority)
      ? task.priority : "Medium",
    dueDate: task.dueDate || "",
    completed: Boolean(task.completed)
  };
}

function toApi(task) {
  return {
    title: task.name,
    priority: task.priority,
    dueDate: task.dueDate || "",
    completed: task.completed
  };
}

async function loadTasks() {
  list.innerHTML = '<div class="empty">Loading tasks...</div>';

  try {
    const result = await apiRequest();

    if (!Array.isArray(result)) {
      throw new Error("Unexpected response from the backend.");
    }

    tasks = result.map(fromApi);
    hideNotice();
    renderTasks();
  } catch (error) {
    tasks = [];
    renderTasks();
    showNotice(error.message, "error");
  }
}

function makePill(text, className) {
  const pill = document.createElement("span");
  pill.className = "pill " + className;
  pill.textContent = text;
  return pill;
}

function renderTasks() {
  list.replaceChildren();

  document.getElementById("total").textContent = tasks.length;
  document.getElementById("done").textContent =
    tasks.filter(task => task.completed).length;
  document.getElementById("pending").textContent =
    tasks.filter(task => !task.completed).length;

  const query = searchInput.value.trim().toLowerCase();

  const visible = tasks.filter(task => {
    const matchesFilter =
      currentFilter === "All" ||
      (currentFilter === "Completed" && task.completed) ||
      (currentFilter === "Pending" && !task.completed);

    return matchesFilter && task.name.toLowerCase().includes(query);
  });

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = tasks.length === 0
      ? "No tasks yet. Add your first task!"
      : "No matching tasks found.";
    list.appendChild(empty);
    return;
  }

  visible.forEach(task => {
    const row = document.createElement("div");
    row.className = "task" + (task.completed ? " completed" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "task-check";
    checkbox.checked = task.completed;
    checkbox.setAttribute("aria-label", "Mark task completed");

    checkbox.addEventListener("change", async () => {
      const previous = task.completed;
      task.completed = checkbox.checked;
      renderTasks();
      setBusy(true);

      try {
        await apiRequest("/" + task.id, {
          method: "PUT",
          body: JSON.stringify(toApi(task))
        });
        hideNotice();
      } catch (error) {
        task.completed = previous;
        showNotice(error.message, "error");
      } finally {
        setBusy(false);
        renderTasks();
      }
    });

    const info = document.createElement("div");
    info.className = "task-info";

    const name = document.createElement("span");
    name.className = "task-name";
    name.textContent = task.name;

    const meta = document.createElement("div");
    meta.className = "task-meta";
    meta.appendChild(
      makePill(task.priority + " Priority", task.priority.toLowerCase())
    );

    if (task.dueDate) {
      const due = document.createElement("span");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dueDate = new Date(task.dueDate + "T00:00:00");
      const overdue = !task.completed && dueDate < today;

      due.className = "pill " + (overdue ? "overdue" : "due");
      due.textContent = (overdue ? "Overdue · " : "Due · ") +
        dueDate.toLocaleDateString();

      meta.appendChild(due);
    }

    info.append(name, meta);

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.setAttribute("aria-label", "Delete " + task.name);

    deleteButton.addEventListener("click", async () => {
      if (busy) return;
      setBusy(true);

      try {
        await apiRequest("/" + task.id, { method: "DELETE" });
        tasks = tasks.filter(item => item.id !== task.id);
        hideNotice();
      } catch (error) {
        showNotice(error.message, "error");
      } finally {
        setBusy(false);
        renderTasks();
      }
    });

    row.append(checkbox, info, deleteButton);
    list.appendChild(row);
  });
}

function setBusy(value) {
  busy = value;
  addButton.disabled = value;
  document.querySelectorAll(".task-check, .delete").forEach(button => {
    button.disabled = value;
  });
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  const name = input.value.trim();
  if (!name) return;

  const newTask = {
    name,
    priority: priorityInput.value,
    dueDate: dueInput.value,
    completed: false
  };

  setBusy(true);

  try {
    const saved = await apiRequest("", {
      method: "POST",
      body: JSON.stringify(toApi(newTask))
    });

    if (!saved || saved.id == null) {
      throw new Error("Task was not returned by the backend.");
    }

    tasks.unshift(fromApi(saved));
    form.reset();
    priorityInput.value = "Medium";
    hideNotice();
    renderTasks();
    input.focus();
  } catch (error) {
    showNotice(error.message, "error");
  } finally {
    setBusy(false);
  }
});

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;

    document.querySelectorAll("[data-filter]").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderTasks();
  });
});

searchInput.addEventListener("input", renderTasks);

// Fetch saved tasks from the Spring Boot backend.
loadTasks();
</script>
</body>
</html>
