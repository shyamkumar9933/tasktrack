
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskTrack | Task Management</title>
<style>
:root {
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --primary: #315bea;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  background: #172554;
  color: white;
  padding: 20px max(5%, calc((100% - 1050px)/2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}
.logo { font-size: 25px; font-weight: 800; }
.logo span { color: #93c5fd; }
.header-tag { color: #cbd5e1; font-size: 14px; }
main { max-width: 1050px; margin: 32px auto; padding: 0 20px; }
h1, h2, h3, p { margin-top: 0; }
.welcome { margin-bottom: 24px; }
.welcome h1 { margin-bottom: 8px; font-size: 30px; }
.welcome p { color: var(--muted); margin-bottom: 0; }
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
.card, .panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
}
.card p { color: var(--muted); margin-bottom: 10px; font-size: 14px; }
.card h2 { margin: 0; font-size: 30px; }
.panel { margin-bottom: 20px; }
.panel h2 { font-size: 19px; margin-bottom: 18px; }
form {
  display: grid;
  grid-template-columns: minmax(160px, 2fr) minmax(130px, 1fr) minmax(140px, 1fr) auto;
  gap: 10px;
}
input, select {
  width: 100%;
  min-width: 0;
  padding: 12px;
  background: white;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text);
}
button {
  padding: 11px 15px;
  border: none;
  border-radius: 8px;
  background: var(--primary);
  color: white;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
button:hover { filter: brightness(.94); }
.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 22px 0 14px;
}
.filters button { background: #e8edf8; color: #334155; }
.filters button.active { background: var(--primary); color: white; }
.search { margin-bottom: 15px; }
.task {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.task:last-child { border-bottom: none; }
.task-check {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  cursor: pointer;
}
.task-info { flex: 1; min-width: 0; }
.task-name {
  display: block;
  font-weight: 600;
  overflow-wrap: anywhere;
  margin-bottom: 7px;
}
.task-meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  border-radius: 20px;
  padding: 4px 9px;
}
.high { background: #fee2e2; color: #b91c1c; }
.medium { background: #fef3c7; color: #92400e; }
.low { background: #dcfce7; color: #166534; }
.due { background: #e0e7ff; color: #3730a3; }
.overdue { background: #b91c1c; color: white; }
.completed .task-name {
  text-decoration: line-through;
  color: #94a3b8;
}
.completed .pill { opacity: .7; }
.delete {
  background: #fee2e2;
  color: #b91c1c;
  padding: 8px 11px;
  flex-shrink: 0;
}
.empty { text-align: center; color: var(--muted); padding: 35px 10px; }
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 0 25px; }
@media(max-width: 760px) {
  form { grid-template-columns: 1fr 1fr; }
  form input:first-child { grid-column: 1 / -1; }
  form button { grid-column: 1 / -1; }
}
@media(max-width: 520px) {
  header { padding: 18px; }
  .header-tag { display: none; }
  main { margin-top: 24px; padding: 0 13px; }
  .welcome h1 { font-size: 25px; }
  .stats { gap: 8px; }
  .card { padding: 14px 10px; }
  .card h2 { font-size: 24px; }
  .card p { font-size: 12px; }
  .panel { padding: 16px; }
  form { grid-template-columns: 1fr; }
  form input:first-child, form button { grid-column: auto; }
  .task { gap: 8px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">Task<span>Track</span></div>
  <div class="header-tag">My Personal Workspace</div>
</header>

<main>
  <section class="welcome">
    <h1>My Tasks</h1>
    <p>Plan your work. Prioritize what matters. Get things done.</p>
  </section>

  <section class="stats">
    <div class="card"><p>Total Tasks</p><h2 id="total">0</h2></div>
    <div class="card"><p>Completed</p><h2 id="done">0</h2></div>
    <div class="card"><p>Pending</p><h2 id="pending">0</h2></div>
  </section>

  <section class="panel">
    <h2>Create a Task</h2>
    <form id="taskForm">
      <input id="taskInput" maxlength="200" placeholder="What do you need to do?" required>
      <select id="taskPriority" aria-label="Task priority">
        <option value="Medium">Medium Priority</option>
        <option value="High">High Priority</option>
        <option value="Low">Low Priority</option>
      </select>
      <input id="taskDue" type="date" aria-label="Due date">
      <button type="submit">+ Add Task</button>
    </form>

    <div class="filters">
      <button type="button" class="active" data-filter="All">All Tasks</button>
      <button type="button" data-filter="Pending">Pending</button>
      <button type="button" data-filter="Completed">Completed</button>
    </div>

    <input id="searchInput" class="search" placeholder="Search tasks..." aria-label="Search tasks">
    <div id="taskList"></div>
  </section>
  <div class="footer">TaskTrack · Personal Task Management</div>
</main>

<script>
const STORAGE_KEY = "tasktrack_tasks";
const form = document.getElementById("taskForm");
const input = document.getElementById("taskInput");
const priorityInput = document.getElementById("taskPriority");
const dueInput = document.getElementById("taskDue");
const searchInput = document.getElementById("searchInput");
const list = document.getElementById("taskList");

let tasks = [];
let currentFilter = "All";

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (Array.isArray(saved)) {
    tasks = saved.filter(t =>
      t && typeof t.name === "string" && t.name.trim()
    ).map(t => ({
      id: t.id || Date.now() + Math.random(),
      name: t.name,
      priority: ["High", "Medium", "Low"].includes(t.priority)
        ? t.priority : "Medium",
      dueDate: t.dueDate || "",
      completed: Boolean(t.completed)
    }));
  }
} catch (error) {
  tasks = [];
}

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (error) {
    alert("Unable to save tasks in this browser.");
  }
}

function makePill(text, className) {
  const pill = document.createElement("span");
  pill.className = "pill " + className;
  pill.textContent = text;
  return pill;
}

function renderTasks() {
  list.replaceChildren();

  document.getElementById("total").textContent = tasks.length;
  document.getElementById("done").textContent =
    tasks.filter(t => t.completed).length;
  document.getElementById("pending").textContent =
    tasks.filter(t => !t.completed).length;

  const query = searchInput.value.trim().toLowerCase();
  const visible = tasks.filter(task => {
    const matchesFilter =
      currentFilter === "All" ||
      (currentFilter === "Completed" && task.completed) ||
      (currentFilter === "Pending" && !task.completed);
    return matchesFilter && task.name.toLowerCase().includes(query);
  });

  if (visible.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = tasks.length === 0
      ? "No tasks yet. Add your first task!"
      : "No matching tasks found.";
    list.appendChild(empty);
    return;
  }

  visible.forEach(task => {
    const row = document.createElement("div");
    row.className = "task" + (task.completed ? " completed" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "task-check";
    checkbox.checked = task.completed;
    checkbox.setAttribute("aria-label", "Mark task completed");
    checkbox.addEventListener("change", () => {
      task.completed = checkbox.checked;
      saveTasks();
      renderTasks();
    });

    const info = document.createElement("div");
    info.className = "task-info";

    const name = document.createElement("span");
    name.className = "task-name";
    name.textContent = task.name;

    const meta = document.createElement("div");
    meta.className = "task-meta";

    const priorityClass = task.priority.toLowerCase();
    meta.appendChild(makePill(task.priority + " Priority", priorityClass));

    if (task.dueDate) {
      const due = document.createElement("span");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dueDate = new Date(task.dueDate + "T00:00:00");
      const isOverdue = !task.completed && dueDate < today;
      due.className = "pill " + (isOverdue ? "overdue" : "due");
      due.textContent = (isOverdue ? "Overdue · " : "Due · ") +
        dueDate.toLocaleDateString();
      meta.appendChild(due);
    }

    info.append(name, meta);

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.setAttribute("aria-label", "Delete " + task.name);
    deleteButton.addEventListener("click", () => {
      tasks = tasks.filter(t => t.id !== task.id);
      saveTasks();
      renderTasks();
    });

    row.append(checkbox, info, deleteButton);
    list.appendChild(row);
  });
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const name = input.value.trim();
  if (!name) return;

  tasks.unshift({
    id: Date.now() + Math.random(),
    name,
    priority: priorityInput.value,
    dueDate: dueInput.value,
    completed: false
  });

  saveTasks();
  form.reset();
  priorityInput.value = "Medium";
  renderTasks();
  input.focus();
});

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    renderTasks();
  });
});

searchInput.addEventListener("input", renderTasks);

renderTasks();
</script>
</body>
</html>
